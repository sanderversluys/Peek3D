name: Peek3D
options:
  bundleIdPrefix: com.sanderv
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: T8CL6FL5T7
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual

targets:
  Peek3D:
    type: application
    platform: macOS
    sources:
      - path: Peek3D
    dependencies:
      - target: PreviewExtension
        embed: true
        codeSign: true
      - target: ThumbnailExtension
        embed: true
        codeSign: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sanderversluys.Peek3D
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: Peek3D/Info.plist
      CODE_SIGN_ENTITLEMENTS: Peek3D/Peek3D.entitlements

  PreviewExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: PreviewExtension
      - path: Shared
    dependencies:
      - package: ZIPFoundation
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sanderversluys.Peek3D.PreviewExtension
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: PreviewExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: PreviewExtension/PreviewExtension.entitlements

  ThumbnailExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ThumbnailExtension
      - path: Shared
    dependencies:
      - package: ZIPFoundation
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sanderversluys.Peek3D.ThumbnailExtension
      GENERATE_INFOPLIST_FILE: false
      INFOPLIST_FILE: ThumbnailExtension/Info.plist
      CODE_SIGN_ENTITLEMENTS: ThumbnailExtension/ThumbnailExtension.entitlements
